<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emploid — Find jobs that are actually hiring</title>
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles2.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="sections-hero.jsx"></script>
  <script type="text/babel" src="sections-showcase.jsx"></script>
  <script type="text/babel" src="sections-main.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "heroStyle": "light",
      "showSourceStrip": true,
      "showFeatureSplit": true,
      "showPerks": true
    }/*EDITMODE-END*/;

    const App = () => {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        return () => obs.disconnect();
      });

      return (
        <React.Fragment>
          <NavBar />
          <HeroSection />
          {t.showSourceStrip && <SourceStrip />}
          <ProductShowcase />
          {t.showFeatureSplit && <FeatureSplit />}
          <StatsBand />
          {t.showPerks && <PerksSection />}
          <ComparisonSection />
          <CTABand />
          <SiteFooter />

          <TweaksPanel title="Home Page">
            <TweakSection label="Sections">
              <TweakToggle label="Source logos strip" value={t.showSourceStrip} onChange={v => setTweak('showSourceStrip', v)} />
              <TweakToggle label="Feature deep-dive cards" value={t.showFeatureSplit} onChange={v => setTweak('showFeatureSplit', v)} />
              <TweakToggle label="Perks grid" value={t.showPerks} onChange={v => setTweak('showPerks', v)} />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
