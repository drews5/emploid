name: Crawl and score jobs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: crawl-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [greenhouse, lever, ashby, smartrecruiters]
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Validate required secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("SUPABASE_URL", "SUPABASE_SERVICE_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub secrets: {', '.join(missing)}")
          print("Supabase secrets are present.")
          PY

      - name: Crawl ATS listings into Supabase
        run: python -u -m scripts.harvester.main --provider "${{ matrix.provider }}"
