name: Crawl and score jobs

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

concurrency:
  group: crawl-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [greenhouse, lever, ashby, smartrecruiters, workday]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      ATS_DISCOVERY_ENABLED: "true"
      ATS_DISCOVERY_USE_LOCAL_CATALOG: "true"
      ATS_DISCOVERY_PAGE_LIMIT: "120"
      ATS_DISCOVERY_LIMIT: "500"
      LEVER_PAGE_SIZE: "100"
      LEVER_MAX_PAGES: "30"
      SMARTRECRUITERS_PAGE_SIZE: "100"
      SMARTRECRUITERS_MAX_PAGES: "50"
      WORKDAY_PAGE_SIZE: "100"
      WORKDAY_MAX_JOBS_PER_BOARD: "500"
      APPWRITE_ENDPOINT: "https://nyc.cloud.appwrite.io/v1"
      APPWRITE_PROJECT_ID: "6a2f1924002c0b611bb1"
      APPWRITE_DATABASE_ID: "emploid"
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPWRITE_API_KEY}" ]]; then
            echo "::error::Missing APPWRITE_API_KEY repository Actions secret."
            exit 1
          fi

      - name: Crawl ATS listings into Appwrite
        run: python -u -m scripts.harvester.main --provider "${{ matrix.provider }}"

  aggregate:
    name: Crawl aggregator searches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"
      JSEARCH_MAX_QUERIES: "12"
      JSEARCH_NUM_PAGES: "1"
      JSEARCH_DATE_POSTED: "week"
      APPWRITE_ENDPOINT: "https://nyc.cloud.appwrite.io/v1"
      APPWRITE_PROJECT_ID: "6a2f1924002c0b611bb1"
      APPWRITE_DATABASE_ID: "emploid"
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPWRITE_API_KEY}" ]]; then
            echo "::error::Missing APPWRITE_API_KEY repository Actions secret."
            exit 1
          fi

      - name: Crawl JSearch into Appwrite
        run: python -u -m scripts.harvester.main --include-jsearch --provider jsearch
